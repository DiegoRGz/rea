<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'" />
    <title>ReelForge Studio</title>
    <style>
      :root {
        --a1: #7c5cff;
        --a2: #ff4d9d;
        --a3: #ff8a3d;
        --ease: cubic-bezier(0.22, 1, 0.36, 1);
        --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; font-family: "Inter", "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; color: #ededf2; user-select: none; }
      .card {
        position: absolute; inset: 10px; border-radius: 26px; overflow: hidden; -webkit-app-region: drag;
        background: radial-gradient(120% 90% at 0% 0%, #1a1530 0%, #0b0b12 55%, #08080c 100%);
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: 0 30px 80px -20px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.06);
        animation: cardIn 0.9s var(--spring) both;
      }
      .card.out { animation: cardOut 0.55s var(--ease) forwards; }
      @keyframes cardIn { from { opacity: 0; transform: scale(0.92) translateY(14px); filter: blur(8px); } to { opacity: 1; transform: none; filter: none; } }
      @keyframes cardOut { to { opacity: 0; transform: scale(1.06); filter: blur(10px); } }

      /* Aurora giratoria */
      .aurora { position: absolute; inset: -40%; background: conic-gradient(from 0deg, transparent 0deg, var(--a1) 60deg, transparent 120deg, var(--a2) 200deg, transparent 260deg, var(--a3) 320deg, transparent 360deg); filter: blur(70px); opacity: 0.32; animation: spin 14s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      .grain { position: absolute; inset: 0; background-image: radial-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px); background-size: 3px 3px; mix-blend-mode: overlay; opacity: 0.5; }
      canvas { position: absolute; inset: 0; width: 100%; height: 100%; }

      .center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; transition: transform 0.7s var(--ease), opacity 0.5s; }
      .center.up { transform: translateY(-212px) scale(0.6); }
      .center.up .tag { opacity: 0 !important; animation: none; }

      /* Logo */
      .logo { width: 104px; height: 104px; position: relative; }
      .logo::before { content: ""; position: absolute; inset: -18px; border-radius: 40px; background: conic-gradient(from 0deg, var(--a1), var(--a2), var(--a3), var(--a1)); filter: blur(26px); opacity: 0; animation: glow 1.2s 0.9s var(--ease) forwards, pulse 2.8s 2.1s ease-in-out infinite; }
      @keyframes glow { to { opacity: 0.55; } }
      @keyframes pulse { 0%, 100% { opacity: 0.55; transform: scale(1); } 50% { opacity: 0.8; transform: scale(1.08); } }
      .logo svg { position: relative; width: 100%; height: 100%; overflow: visible; }
      .frame-stroke { fill: none; stroke: url(#g); stroke-width: 3.5; stroke-dasharray: 380; stroke-dashoffset: 380; animation: draw 1.1s 0.15s var(--ease) forwards; }
      .frame-fill { fill: url(#g); opacity: 0; animation: fillIn 0.6s 0.95s var(--ease) forwards; }
      .play { fill: #fff; transform-origin: 52px 52px; transform: scale(0) rotate(-90deg); animation: playIn 0.7s 1.15s var(--spring) forwards; }
      .ring { fill: none; stroke: rgba(255, 255, 255, 0.5); stroke-width: 1.5; transform-origin: 52px 52px; opacity: 0; animation: ripple 2.4s 1.4s var(--ease) infinite; }
      @keyframes draw { to { stroke-dashoffset: 0; } }
      @keyframes fillIn { to { opacity: 1; } }
      @keyframes playIn { to { transform: scale(1) rotate(0); } }
      @keyframes ripple { 0% { opacity: 0.6; transform: scale(0.9); } 100% { opacity: 0; transform: scale(1.7); } }

      .title { font-size: 34px; font-weight: 780; letter-spacing: -0.03em; display: flex; }
      .title span { display: inline-block; opacity: 0; transform: translateY(18px) rotateX(70deg); animation: letter 0.7s var(--spring) forwards; }
      .title .grad { background: linear-gradient(135deg, var(--a1), var(--a2) 55%, var(--a3)); -webkit-background-clip: text; background-clip: text; color: transparent; }
      @keyframes letter { to { opacity: 1; transform: none; } }
      .tag { font-size: 13px; color: #9a9aae; letter-spacing: 0.02em; opacity: 0; animation: fade 0.8s 1.7s ease forwards; }
      @keyframes fade { to { opacity: 1; } }

      .bottom { position: absolute; left: 44px; right: 44px; bottom: 34px; opacity: 0; animation: fade 0.6s 1.2s ease forwards; transition: opacity 0.4s; }
      .bar { height: 5px; border-radius: 5px; background: rgba(255, 255, 255, 0.07); overflow: hidden; position: relative; }
      .bar i { position: absolute; left: 0; top: 0; bottom: 0; width: 4%; border-radius: 5px; background: linear-gradient(90deg, var(--a1), var(--a2), var(--a3)); transition: width 0.7s var(--ease); box-shadow: 0 0 14px rgba(255, 77, 157, 0.7); }
      .bar i::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.6), transparent); animation: shimmer 1.3s infinite; }
      @keyframes shimmer { from { transform: translateX(-100%); } to { transform: translateX(100%); } }
      .status { display: flex; justify-content: space-between; margin-top: 12px; font-size: 12px; color: #a3a3b6; }
      .status b { font-weight: 600; color: #d8d8e4; transition: opacity 0.25s; }
      .status .ver { font-variant-numeric: tabular-nums; }

      /* Configuración inicial */
      .setup { position: absolute; left: 34px; right: 34px; top: 168px; bottom: 26px; display: flex; flex-direction: column; gap: 12px; opacity: 0; transform: translateY(24px); pointer-events: none; transition: all 0.6s var(--ease); -webkit-app-region: no-drag; }
      .setup.on { opacity: 1; transform: none; pointer-events: auto; }
      .setup h2 { margin: 0; font-size: 16px; }
      .setup p { margin: 0; font-size: 12px; color: #9a9aae; }
      .steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; font-size: 12px; }
      .steps li { display: flex; gap: 8px; align-items: flex-start; padding: 7px 10px; border-radius: 10px; background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.06); animation: rise 0.5s var(--ease) both; }
      .steps li:nth-child(2) { animation-delay: 0.05s; } .steps li:nth-child(3) { animation-delay: 0.1s; } .steps li:nth-child(4) { animation-delay: 0.15s; } .steps li:nth-child(5) { animation-delay: 0.2s; } .steps li:nth-child(6) { animation-delay: 0.25s; }
      @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
      .steps input { accent-color: var(--a1); margin: 1px 0 0; }
      .row { display: flex; gap: 10px; align-items: center; }
      .grow { flex: 1; }
      button { -webkit-app-region: no-drag; height: 36px; padding: 0 16px; border-radius: 10px; border: 1px solid rgba(255, 255, 255, 0.12); background: rgba(255, 255, 255, 0.06); color: #fff; font: 600 13px inherit; font-family: inherit; cursor: pointer; transition: transform 0.25s var(--spring), box-shadow 0.3s, background 0.2s; }
      button:hover { transform: translateY(-1px); background: rgba(255, 255, 255, 0.1); }
      button:active { transform: scale(0.95); }
      button.primary { border: 0; background: linear-gradient(135deg, var(--a1), var(--a2) 55%, var(--a3)); box-shadow: 0 8px 24px -8px rgba(255, 77, 157, 0.8); }
      button.primary:hover { box-shadow: 0 12px 30px -8px rgba(255, 77, 157, 1); }
      .log { flex: 1; min-height: 0; overflow: auto; font: 11px/1.5 "Cascadia Code", Consolas, monospace; color: #8f8fa3; background: rgba(0, 0, 0, 0.35); border-radius: 10px; padding: 8px 10px; white-space: pre-wrap; word-break: break-all; border: 1px solid rgba(255, 255, 255, 0.05); user-select: text; }
      .warn { color: #fcd34d; font-size: 12px; }
      .hidden { display: none !important; }
    </style>
  </head>
  <body>
    <div class="card" id="card">
      <div class="aurora"></div>
      <canvas id="particles"></canvas>
      <div class="grain"></div>
      <div class="center" id="center">
        <div class="logo">
          <svg viewBox="0 0 104 104" aria-hidden="true">
            <defs>
              <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#7c5cff" /><stop offset=".55" stop-color="#ff4d9d" /><stop offset="1" stop-color="#ff8a3d" />
              </linearGradient>
            </defs>
            <rect class="ring" x="6" y="6" width="92" height="92" rx="28" />
            <rect class="frame-fill" x="6" y="6" width="92" height="92" rx="28" />
            <rect class="frame-stroke" x="6" y="6" width="92" height="92" rx="28" />
            <path class="play" d="M42 33 L42 71 L73 52 Z" stroke="#fff" stroke-width="4" stroke-linejoin="round" />
          </svg>
        </div>
        <div class="title" id="title"></div>
        <div class="tag">Estudio de IA local para reels virales</div>
      </div>

      <div class="bottom" id="bottom">
        <div class="bar"><i id="bar"></i></div>
        <div class="status"><b id="status">Iniciando…</b><span class="ver" id="pct">0%</span></div>
      </div>

      <div class="setup" id="setup">
        <div>
          <h2>Configuración inicial</h2>
          <p>Primera ejecución: se preparará el entorno local. Revisa el plan y pulsa «Instalar».</p>
        </div>
        <div id="noPython" class="warn hidden">No se encontró Python 3.10–3.12. Instálalo (marca «Add python.exe to PATH») y pulsa «Reintentar».</div>
        <ul class="steps" id="steps"></ul>
        <div class="log hidden" id="log"></div>
        <div class="row">
          <span class="grow" id="gpuInfo" style="font-size:12px;color:#9a9aae"></span>
          <button id="quit">Salir</button>
          <button id="pyBtn" class="hidden">Descargar Python</button>
          <button id="retry" class="hidden">Reintentar</button>
          <button id="install" class="primary">Instalar</button>
        </div>
      </div>
    </div>
    <script>
      // Título letra a letra
      const title = document.getElementById("title");
      [..."ReelForge"].forEach((ch, i) => {
        const s = document.createElement("span");
        s.textContent = ch;
        if (i >= 4) s.className = "grad";
        s.style.animationDelay = `${0.55 + i * 0.05}s`;
        title.append(s);
      });
      const studio = document.createElement("span");
      studio.textContent = " Studio";
      studio.style.animationDelay = "1.05s";
      studio.style.fontWeight = "500";
      studio.style.color = "#cfcfe0";
      title.append(studio);

      // Partículas
      const cv = document.getElementById("particles");
      const ctx = cv.getContext("2d");
      const dpr = window.devicePixelRatio || 1;
      let W = 0, H = 0;
      const resize = () => { W = cv.clientWidth; H = cv.clientHeight; cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); };
      resize();
      const colors = ["124,92,255", "255,77,157", "255,138,61", "255,255,255"];
      const parts = Array.from({ length: 70 }, () => ({ x: Math.random() * W, y: Math.random() * H, r: Math.random() * 1.8 + 0.4, vx: (Math.random() - 0.5) * 0.25, vy: -Math.random() * 0.45 - 0.08, a: Math.random() * 0.6 + 0.2, c: colors[(Math.random() * colors.length) | 0], t: Math.random() * 6 }));
      let boost = 1;
      (function frame() {
        ctx.clearRect(0, 0, W, H);
        for (const p of parts) {
          p.t += 0.02;
          p.x += p.vx * boost + Math.sin(p.t) * 0.15;
          p.y += p.vy * boost;
          if (p.y < -5) { p.y = H + 5; p.x = Math.random() * W; }
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(${p.c},${p.a * (0.6 + 0.4 * Math.sin(p.t * 2))})`;
          ctx.shadowBlur = 8;
          ctx.shadowColor = `rgba(${p.c},0.8)`;
          ctx.fill();
        }
        requestAnimationFrame(frame);
      })();

      const $ = (id) => document.getElementById(id);
      let shown = 0;
      let target = 0.04;
      // Avance suave del porcentaje
      (function tick() {
        shown += (target - shown) * 0.08;
        $("bar").style.width = `${Math.max(4, shown * 100)}%`;
        $("pct").textContent = `${Math.round(shown * 100)}%`;
        requestAnimationFrame(tick);
      })();
      const setStatus = (text) => {
        const el = $("status");
        el.style.opacity = 0;
        setTimeout(() => { el.textContent = text; el.style.opacity = 1; }, 150);
      };

      if (window.splash) {
        splash.onStatus(({ text, progress }) => { if (text) setStatus(text); if (typeof progress === "number") target = progress; });
        splash.onDone(() => { target = 1; boost = 6; setTimeout(() => $("card").classList.add("out"), 250); });
        let choice = { ai: true, ffmpeg: true, fonts: true };
        splash.onSetup((plan) => {
          $("center").classList.add("up");
          $("bottom").classList.add("hidden");
          $("setup").classList.add("on");
          $("log").classList.add("hidden");
          $("steps").classList.remove("hidden");
          $("install").classList.remove("hidden");
          const opt = { 3: "ai", 4: plan.ffmpeg || !plan.canDownloadFfmpeg ? null : "ffmpeg", 5: "fonts" };
          $("steps").replaceChildren(...plan.steps.map((text, i) => {
            const li = document.createElement("li");
            if (opt[i]) {
              const cb = document.createElement("input");
              cb.type = "checkbox";
              cb.checked = choice[opt[i]];
              cb.onchange = () => (choice[opt[i]] = cb.checked);
              li.append(cb);
            } else {
              li.append(document.createTextNode("•"));
            }
            li.append(document.createTextNode(" " + text));
            return li;
          }));
          if (plan.ffmpeg || !plan.canDownloadFfmpeg) choice.ffmpeg = false;
          $("noPython").classList.toggle("hidden", !!plan.python);
          $("pyBtn").classList.toggle("hidden", !!plan.python);
          $("retry").classList.toggle("hidden", !!plan.python);
          $("install").disabled = !plan.python;
          $("gpuInfo").textContent = plan.gpu ? `GPU: ${plan.gpu}` : "Sin GPU NVIDIA detectada";
        });
        splash.onLog((line) => {
          const log = $("log");
          log.textContent += line + "\n";
          if (log.textContent.length > 20000) log.textContent = log.textContent.slice(-15000);
          log.scrollTop = log.scrollHeight;
        });
        splash.onSetupError((msg) => {
          $("install").classList.add("hidden");
          $("retry").classList.remove("hidden");
          setStatus(`Error: ${msg}`);
        });
        $("install").onclick = () => {
          $("steps").classList.add("hidden");
          $("log").classList.remove("hidden");
          $("install").classList.add("hidden");
          $("bottom").classList.remove("hidden");
          $("setup").style.bottom = "86px";
          splash.choose({ action: "install", ...choice });
        };
        $("retry").onclick = () => { $("setup").style.bottom = ""; splash.choose({ action: "retry" }); };
        $("quit").onclick = () => splash.choose({ action: "quit" });
        $("pyBtn").onclick = () => splash.openPython();
      } else {
        // Vista previa en navegador
        let p = 0;
        const msgs = ["Comprobando el entorno…", "Iniciando el motor de IA…", "Detectando GPU…", "Cargando la interfaz…", "¡Listo!"];
        const iv = setInterval(() => { p += 0.2; target = Math.min(1, p); setStatus(msgs[Math.min(4, Math.round(p * 5) - 1)]); if (p >= 1) clearInterval(iv); }, 900);
      }
    </script>
  </body>
</html>
