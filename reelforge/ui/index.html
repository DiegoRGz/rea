<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ReelForge Studio</title>
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <div class="app">
      <header class="titlebar">
        <div class="brand">
          <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
            <defs>
              <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#7c5cff" /><stop offset=".55" stop-color="#ff4d9d" /><stop offset="1" stop-color="#ff8a3d" />
              </linearGradient>
            </defs>
            <rect x="2" y="2" width="28" height="28" rx="8" fill="url(#lg)" />
            <path d="M13 10.5v11l9-5.5z" fill="#fff" />
          </svg>
          ReelForge Studio
        </div>
        <div class="spacer"></div>
        <div id="update-pill"></div>
        <div id="gpu-pill" class="status-pill"></div>
        <div class="win-controls" id="win-controls"></div>
      </header>
      <div class="body">
        <nav class="sidebar" id="sidebar"></nav>
        <main class="main" id="main"></main>
      </div>
    </div>
    <div class="toasts" id="toasts"></div>
    <div class="jobdock" id="jobdock"></div>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
